<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Long Haul</title>
  <link rel="icon" type="image/png" href="assets/branding/long-haul-icon.png"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/hud.css"/>
  <link rel="stylesheet" href="css/menus.css"/>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f0c09">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Long Haul game view"></canvas>

  <!-- Screen effects (js/ui/hud.js): damage / exhaustion vignette under the HUD, sleep fade above it -->
  <div id="hud-vignette" aria-hidden="true"></div>
  <!-- Gameplay HUD: built and updated by js/ui/hud.js (hud.init) -->
  <div id="hud" hidden></div>
  <div id="hud-fade" hidden></div>
  <!-- Menus and overlay screens: rendered by js/ui/menus.js (menus.init / menus.show) -->
  <div id="menus" hidden></div>

  <!-- Opening (css/base.css), over everything while the game loads behind it: the X-ORBIT Studios logo fades in and
       collapses into the middle of the screen, the Long Haul logo pops out of it with a tip underneath, then it all
       fades into the game. A click or key skips ahead (js/main.js). -->
  <div id="splash" aria-label="X-ORBIT Studios presents Long Haul">
    <img class="sp-studio" src="assets/branding/xorbit-studios.png" alt="" decoding="async"/>
    <i class="sp-spark" aria-hidden="true"></i>
    <div class="sp-game">
      <img src="assets/branding/long-haul-logo.png" alt="Long Haul" decoding="async"/>
      <p class="sp-tip"><b>Tip</b><span id="sp-tip"></span></p>
    </div>
  </div>
  <script>
    // A tip for the opening, picked before the game's modules have loaded
    (function () {
      var tips = [
        "Water first: in this heat, thirst gets you long before hunger does.",
        "Check the oil at the dipstick before a long stretch. An engine run dry seizes.",
        "Fuel stations are 5 to 8 km apart. A jerrycan in the bed buys you peace of mind.",
        "Running hot? Pull over, open the hood and top up the radiator once it has cooled.",
        "Press M for the map. It only shows the road you've actually driven.",
        "A Digimap shows what's ahead, but places ahead are far more likely to have closed down.",
        "Too tired to drive? Sleep in the cab with Z. Nodding off at the wheel ends badly.",
        "Hitchhikers pay well, though not every passenger means well.",
        "Roadblock crews want your money. Pay, talk your way out, or floor it and disable their cars.",
        "Drive with friends: Play, then Convoy. Turn on voice chat to talk on the road.",
        "In chase view, the mouse wheel zooms the camera. C switches views.",
        "Smoke from under the hood means the engine is failing. Keep a repair kit handy.",
        "Carry supplies to the truck bed and click to secure them for the drive."
      ];
      var el = document.getElementById("sp-tip");
      if (el) el.textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
  </script>
  <!-- Shown until the modules have loaded; removed by menus.init -->
  <div id="boot">Long Haul</div>
  <noscript><div id="boot">Long Haul needs JavaScript.</div></noscript>

  <script type="module" src="js/main.js"></script>
  <script src="./install.js"></script>
</body>
</html>
